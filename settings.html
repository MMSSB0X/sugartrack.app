        <script>
    // Logout functionality
    document.addEventListener('DOMContentLoaded', function() {
        const logoutBtn = document.getElementById('settings-logout-btn');
        
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                auth.signOut()
                    .then(() => {
                        window.location.href = 'login.html';
                    })
                    .catch((error) => {
                        console.error('Logout error:', error);
                        alert('Error logging out. Please try again.');
                    });
            });
        }
    });
</script>
    <script>
        // Load user data for settings page
        document.addEventListener('DOMContentLoaded', function() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // Load user data from Firestore
                    db.collection('users').doc(user.uid).get()
                        .then((doc) => {
                            if (doc.exists) {
                                const userData = doc.data();
                                
                                // Update profile image
                                const profileImg = document.getElementById('profile-img-settings');
                                if (profileImg && userData.profileImage) {
                                    profileImg.src = userData.profileImage;
                                }
                                
                                // if (profileImg && userData.profileImageUrl) {
                                //     profileImg.src = userData.profileImageUrl;
                                // }
                                
                                // Update user name
                                const userName = document.getElementById('settings-user-name');
                                if (userName) {
                                    const fullName = [userData.firstName, userData.lastName].filter(Boolean).join(' ');
                                    userName.textContent = fullName || 'User';
                                }
                                
                                // Update email
                                const userEmail = document.getElementById('settings-user-email');
                                if (userEmail) {
                                    userEmail.textContent = user.email || userData.email || 'No email';
                                }
                            }
                        })
                        .catch((error) => {
                            console.error("Error loading user data:", error);
                        });
                } else {
                    // Redirect to login if not authenticated
                    window.location.href = 'login.html';
                }
            });
        });
    </script>
