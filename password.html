<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - SugarTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/font-awesome-icons7/css/all.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/remix-icons/remixicon.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding-bottom: 0 !important;">

    <!-- SETTINGS HEADER -->
    <div class="settings-header">
        <button class="back-button" id="settings-back-btn" onclick="window.location.href='account.html';">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h2>Change Password</h2>
    </div>

    <main class="dashboard-container settings-page-new2">
        <form id="password-form" class="login-form" style="max-width: 900px; margin-top: 2rem; gap: 1.5rem;">
            
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>

            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" placeholder="Enter your current password" required>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter your new password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your new password" required>
            </div>

            <button type="submit" id="save-password-btn" class="login-button">
                Change Password
            </button>
        </form>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- Main App Logic -->
    <script src="log/firebaseconfig.js"></script>
    <script src="theme.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordForm = document.getElementById('password-form');
            const savePasswordBtn = document.getElementById('save-password-btn');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');

            if (passwordForm) {
                passwordForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const currentPassword = document.getElementById('currentPassword').value;
                    const newPassword = document.getElementById('newPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;

                    // Validation
                    if (!currentPassword || !newPassword || !confirmPassword) {
                        showMessage('Please fill in all fields', 'error');
                        return;
                    }

                    if (newPassword !== confirmPassword) {
                        showMessage('New passwords do not match', 'error');
                        return;
                    }

                    if (newPassword.length < 6) {
                        showMessage('New password must be at least 6 characters long', 'error');
                        return;
                    }

                    savePasswordBtn.disabled = true;
                    savePasswordBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Changing Password...';

                    const user = auth.currentUser;
                    const credential = firebase.auth.EmailAuthProvider.credential(
                        user.email, 
                        currentPassword
                    );

                    // Re-authenticate user
                    user.reauthenticateWithCredential(credential)
                        .then(() => {
                            // Password change successful
                            return user.updatePassword(newPassword);
                        })
                        .then(() => {
                            showMessage('Password changed successfully!', 'success');
                            passwordForm.reset();
                            
                            setTimeout(() => {
                                window.location.href = 'profile.html';
                            }, 1500);
                        })
                        .catch((error) => {
                            console.error('Error changing password:', error);
                            
                            if (error.code === 'auth/wrong-password') {
                                showMessage('Current password is incorrect', 'error');
                            } else if (error.code === 'auth/weak-password') {
                                showMessage('New password is too weak', 'error');
                            } else {
                                showMessage('Error changing password. Please try again.', 'error');
                            }
                        })
                        .finally(() => {
                            savePasswordBtn.disabled = false;
                            savePasswordBtn.textContent = 'Change Password';
                        });
                });
            }

            function showMessage(message, type) {
                if (type === 'error') {
                    errorMessage.textContent = message;
                    errorMessage.style.display = 'block';
                    successMessage.style.display = 'none';
                } else {
                    successMessage.textContent = message;
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                }
                
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                    successMessage.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
