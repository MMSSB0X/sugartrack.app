<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - SugarTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    
    <!-- Your Custom Styles -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Specific styles for the welcome page alignment */
        .welcome-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .app-logo {
            margin-bottom: 1.5rem;
            font-size: 4rem;
            color: var(--primary-btn-bg);
        }

        .welcome-text {
            color: var(--placeholder-color);
            margin-bottom: 2.5rem;
            font-size: 1rem;
            line-height: 1.5;
            /* max-width: 300px; */
        }

        .btn-secondary {
            background-color: transparent;
            border: 2px solid var(--primary-btn-bg);
            color: var(--text-color); 
        }
        
        .btn-secondary:hover {
            background-color: var(--input-bg);
        }
    </style>
</head>
<body>

    <main class="login-container">
        <div class="welcome-content" style="text-align: center;">
            <!-- Animated Logo/Icon -->
             <div class="logo2">ST</div>
            <br>
            <!-- <h1 class="logoname">SugarTrack</h1> -->
            </div>
            
            <!-- Or use your text logo class if preferred -->
            <!-- <div class="logo2">ST</div> -->

            <h1 style="text-align: center;">SugarTrack</h1>
            <p class="welcome-text" style="text-align: center;">
                Monitor your health, track your progress, and stay in control of your journey.
            </p>

            <div style="width: 100%; display: flex; flex-direction: column; gap: 1rem;">
                <!-- Login Button -->
                <a href="login.html" class="login-button" style="text-decoration: none; display: block; text-align: center;">
                    Login
                </a>

                <!-- Signup Button -->
                <a href="signup.html" class="login-button btn-secondary" style="text-decoration: none; display: block; text-align: center;">
                    Create New Account
                </a>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs (Must match version in login.html) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <!-- Your Configuration Files -->
    <script src="log/firebaseconfig.js"></script>
    <script src="theme.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check Authentication State
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // User is signed in, redirect to dashboard
                    console.log("User already logged in, redirecting to dashboard...");
                    window.location.href = 'dashboard.html';
                } else {
                    // No user is signed in, stay on welcome page
                    // Fade in the body or content if you want a smooth entry
                    document.body.style.opacity = '1';
                    document.body.style.visibility = 'visible';
                }
            });

            // Optional: Add slide transition effect for links
            const links = document.querySelectorAll('a');
            links.forEach(link => {
                link.addEventListener('click', function(event) {
                    // Allow default navigation, but add class for animation if needed
                    // event.preventDefault(); 
                    document.body.classList.add('slide-out');
                });
            });
        });
    </script>
</body>
</html>
