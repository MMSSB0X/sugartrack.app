<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetOS Watch</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="log/firebaseconfig.js"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- WATCH DESIGN --- */
        :root { --bezel: #222; --accent: #3b82f6; }
        body { background: #000; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; overflow: hidden; }
        
        .watch-container { position: relative; width: 320px; height: 400px; display: flex; justify-content: center; align-items: center; }
        
        .strap { position: absolute; width: 180px; height: 100%; background: #1a1a1a; border-radius: 40px; z-index: 1; }
        .strap.top { top: -100px; } .strap.bottom { bottom: -100px; }
        
        .case { position: relative; width: 300px; height: 300px; background: linear-gradient(145deg, #333, #111); border-radius: 50%; z-index: 5; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
        .screen { width: 270px; height: 270px; background: #000; border-radius: 50%; position: relative; overflow: hidden; z-index: 10; color: white; text-align: center; }
        
        /* Physical Buttons */
        .crown { position: absolute; right: -12px; width: 16px; height: 50px; background: #444; border-radius: 4px; z-index: 4; cursor: pointer; top: 50%; transform: translateY(-50%); transition: 0.1s; }
        .crown:active { transform: translateY(-50%) scale(0.95); }

        /* Screens */
        .view { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.4s; transform: scale(0.9); }
        .view.active { opacity: 1; visibility: visible; transform: scale(1); }

        /* Pairing UI */
        .qr-box { background: white; padding: 10px; border-radius: 10px; margin: 10px 0; }
        .qr-img { width: 140px; height: 140px; display: block; }
        .status { color: #888; font-size: 11px; margin-top: 5px; font-weight: bold; }
        
        /* Loading Spinner */
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Face UI */
        .time-large { font-size: 60px; font-weight: 200; margin: 5px 0; line-height: 1; }
        .glucose-display { background: rgba(59, 130, 246, 0.2); padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; gap: 8px; }
        .glucose-val { font-size: 24px; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

    <div class="watch-container">
        <div class="strap top"></div><div class="strap bottom"></div>
        <div class="crown" onclick="toggleView()" title="Home Button"></div>
        <div class="case">
            <div class="screen">
                
                <div id="view-pair" class="view active">
                    <div style="font-size: 14px;">Scan to Pair</div>
                    <div class="qr-box">
                        <img id="qr-img" class="qr-img" src="" alt="QR Code">
                    </div>
                    <div class="status" id="conn-status">Generating ID...</div>
                </div>

                <div id="view-loading" class="view">
                    <div class="spinner"></div>
                    <div style="margin-top:15px; font-size:12px; color:#aaa;">Syncing Profile...</div>
                </div>

                <div id="view-face" class="view">
                    <div style="color: #3b82f6; font-size: 12px; letter-spacing: 1px; margin-bottom:5px;">CONNECTED</div>
                    <div class="time-large" id="clock">12:00</div>
                    
                    <div class="glucose-display">
                        <i class="fa-solid fa-droplet" style="color:#3b82f6;"></i>
                        <span class="glucose-val" id="glucose-val">--</span>
                        <span style="font-size:12px; color:#ccc;">mg/dL</span>
                    </div>
                    
                    <div style="font-size: 10px; margin-top: 20px; opacity: 0.5;" id="user-name-display">User</div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- 1. SETUP WATCH ID ---
        let watchId = localStorage.getItem('watch_id');
        if(!watchId) {
            // Create a random 6-character ID (simple and short)
            watchId = Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('watch_id', watchId);
        }

        // --- 2. CHECK LOGIN STATE ---
        const savedUserId = localStorage.getItem('paired_user');
        
        if(savedUserId) {
            // Already logged in? Skip to OS
            enterOS(savedUserId);
        } else {
            // Not logged in? Start Pairing
            initPairing();
        }

        // --- 3. PAIRING LOGIC (The "Waiting" Fix) ---
        function initPairing() {
            // A. Show QR Code
            // This format MUST match what the Phone expects: SUGARTRACK_WATCH_ID_XXXXX
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=SUGARTRACK_WATCH_ID_${watchId}`;
            document.getElementById('qr-img').src = qrUrl;
            document.getElementById('conn-status').textContent = `ID: ${watchId}`;

            console.log(`Watch listening for handshake on ID: ${watchId}`);

            // B. LISTEN FOR HANDSHAKE
            // We listen to the 'pending_setups' collection. 
            // When the Phone scans the QR, it writes a document here with our 'watchId'.
            const unsubscribe = db.collection('pending_setups').doc(watchId)
                .onSnapshot((doc) => {
                    if(doc.exists) {
                        const data = doc.data();
                        if(data.userId) {
                            console.log("Handshake received!", data);
                            
                            // 1. Show User we found them
                            document.getElementById('conn-status').textContent = "Phone Found!";
                            document.getElementById('conn-status').style.color = "#4caf50"; // Green
                            
                            // 2. Save Data
                            localStorage.setItem('paired_user', data.userId);
                            
                            // 3. Clean up (Security) - Delete the handshake doc
                            db.collection('pending_setups').doc(watchId).delete();
                            
                            // 4. Stop Listening
                            unsubscribe();
                            
                            // 5. Enter OS (with small delay for effect)
                            showView('loading');
                            setTimeout(() => enterOS(data.userId), 1500);
                        }
                    }
                });
        }

        // --- 4. MAIN OS LOGIC ---
        function enterOS(userId) {
            showView('face');

            // Load User Name (Optional, just to look nice)
            db.collection('users').doc(userId).get().then(doc => {
                if(doc.exists) {
                    const name = doc.data().firstName || "User";
                    document.getElementById('user-name-display').textContent = name;
                }
            });

            // Listen for Real-time Glucose Data
            db.collection('readings')
                .where('userId', '==', userId)
                .orderBy('timestamp', 'desc')
                .limit(1)
                .onSnapshot(snap => {
                    if(!snap.empty) {
                        const d = snap.docs[0].data();
                        // Support multiple field names just in case
                        const val = d.glucose || d.value || d.sugar_level || '--';
                        document.getElementById('glucose-val').textContent = val;
                    } else {
                        document.getElementById('glucose-val').textContent = '--';
                    }
                }, err => {
                    console.error("Data Sync Error:", err);
                });
        }

        // --- 5. UTILITIES ---
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
        }

        function toggleView() {
            // Hardware Button Logic (Disconnect for testing)
            if(localStorage.getItem('paired_user')) {
                if(confirm("Unpair Watch?")) {
                    localStorage.removeItem('paired_user');
                    location.reload();
                }
            }
        }

        // Clock Tick
        setInterval(() => {
            const d = new Date();
            const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            document.getElementById('clock').textContent = timeStr;
        }, 1000);
    </script>
</body>
</html>
