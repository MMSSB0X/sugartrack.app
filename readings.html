<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Readings - SugarTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/font-awesome-icons7/css/all.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/remix-icons/remixicon.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .sort-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .sort-button {
            background-color: var(--input-bg);
            color: var(--placeholder-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .sort-button:hover {
            background-color: var(--border-color);
        }
        .sort-button.active {
            background-color: var(--primary-btn-bg);
            color: var(--primary-btn-text);
        }
    </style>
</head>
<body data-theme="system" style="padding-bottom: 0 !important;">

    <div class="settings-header">
        <button class="back-button" id="readings-back-btn" onclick="window.location.href='dashboard.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h2>All Readings</h2>
    </div>

    <main class="dashboard-container settings-page-new">
        <div class="readtile">
            <h1 id="welcome-message">Readings</h1>
        </div>
        <div class="header-right2">
            <button id="export-btn" class="header-button2">
            <!-- <button id="export-btn" class="header-button2"> -->
                <!-- <i class="fas fa-file-pdf" style="color: var(--out-of-range-color);"></i>  -->
                 <img src="images/pdf.png" style="width: 25px;" alt="">
                Export Report
            </button>
        </div>
        <br>
        
        <!-- ADDED: Sort Controls -->
        <!-- <div class="sort-controls">
            <button id="sort-newest" class="sort-button active">Newest First</button>
            <button id="sort-oldest" class="sort-button">Oldest First</button>
        </div> -->

        <!-- This container will be filled by readings.js -->
        <div class="history-list-container" id="readings-list-container">
            <!-- Static content removed, will be populated by JS -->
            <p>Loading readings...</p>
        </div>

    </main>
    <!-- Add this modal to readings.html (before closing body tag) -->
<div id="editReadingModal" class="modal">
    <div class="modal-content reading-modal">
        <div class="modal-header">
            <h3>Edit Reading</h3>
            <span class="close-modal">&times;</span>
        </div>
        <div class="modal-body">
            <form id="edit-reading-form" class="login-form">
                <input type="hidden" id="edit-reading-id">
                <div class="form-group">
                    <label for="edit-glucose-value">Glucose Level (mg/dL)</label>
                    <input type="number" id="edit-glucose-value" placeholder="Enter glucose level" required min="1" max="600">
                </div>
                
                <div class="form-group">
                    <label for="edit-reading-comment">Comment (Optional)</label>
                    <textarea id="edit-reading-comment" placeholder="Add any notes..." rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="edit-reading-date">Date</label>
                    <input type="date" id="edit-reading-date" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-reading-time">Time</label>
                    <input type="time" id="edit-reading-time" required>
                </div>
            </form>
        </div>
        <div class="modal-footer" style="flex-direction: row-reverse;">
            <!-- <button type="button" class="login-button" style="background-color: var(--out-of-range-color);" onclick="closeEditReadingModal()">
                Cancel
            </button> -->
            <button type="button" class="login-button" style="padding: 0.5rem;" onclick="saveEditedReading()">
                <i class="fas fa-save"></i> Save Changes
            </button>
            <!-- <button type="button" class="login-button" style="background-color: var(--out-of-range-color); padding: 0.5rem;" onclick="deleteReading()" id="delete-reading-btn">
                <i class="fas fa-trash"></i> Delete
            </button> -->
            <button type="button" class="login-button" style="background-color: var(--out-of-range-color); padding: 0.5rem;" onclick="showDeleteConfirmation()" id="delete-reading-btn">
                                <i class="fas fa-trash"></i> Delete
            </button>
        </div>
    </div>
</div>
<div id="deleteConfirmModal" class="modal">
    <div class="modal-content reading-modal" style="max-width: 400px;">
        <div class="modal-header">
            <h3>Confirm Deletion</h3>
            <span class="close-modal" onclick="cancelDelete()">&times;</span>
        </div>
        <div class="modal-body" style="text-align: center; padding-top: 2rem; padding-bottom: 2rem;">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--out-of-range-color); margin-bottom: 1rem;"></i>
            
            <p style="font-size: 1.1rem; color: var(--text-color); line-height: 1.5;">
                Are you sure you want to delete this reading?
                <br>
                <strong>This action cannot be undone.</strong>
            </p>
        </div>
        <div class="modal-footer">
            <button type="button" class="login-button" style="background-color: var(--input-bg); color: var(--text-color); padding: 0.5rem;" onclick="cancelDelete()">
                Cancel
            </button>
            <button type="button" class="login-button" style="background-color: var(--out-of-range-color); padding: 0.5rem;" onclick="confirmDelete()" id="confirm-delete-btn">
                <i class="fas fa-trash"></i> Delete Anyway
            </button>
        </div>
    </div>
</div>
    <!-- JS Libraries needed for PDF Export - LOAD FIRST -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="jspdf/jspdf.umd.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- Main App Logic -->
    <script src="log/firebaseconfig.js"></script>
    <script src="theme.js"></script>
    <script src="readings.js"></script>
        <!-- <script src="https://mmssb.github.io/sugartrack.com/dashboard/sources/readings.js"></script> -->

</body>
</html>
