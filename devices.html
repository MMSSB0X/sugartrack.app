<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices - SugarTrack</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        /* [Kept your original CSS styles] */
        .scan-widget { background: linear-gradient(135deg, var(--primary-btn-bg), #2563eb); border-radius: 1.5rem; padding: 2rem; color: white; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); position: relative; overflow: hidden; }
        .scan-content h2 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700; }
        .scan-btn { background: white; color: var(--primary-btn-bg); border: none; padding: 0.75rem 1.5rem; border-radius: 2rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .device-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 1.25rem; padding: 1.25rem; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; animation: fadeInUp 0.5s ease; }
        .device-icon-wrapper { width: 60px; height: 60px; background: var(--input-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; color: var(--primary-btn-bg); margin-bottom: 1rem; }
        .device-name { font-weight: 700; color: var(--text-color); font-size: 1rem; margin-bottom: 0.25rem; }
        .device-status { font-size: 0.8rem; color: var(--placeholder-color); margin-bottom: 1rem; }
        .status-dot { position: absolute; top: 1rem; right: 1rem; width: 10px; height: 10px; border-radius: 50%; background-color: var(--in-range-color); box-shadow: 0 0 8px var(--in-range-color); }
        .card-action-btn { width: 100%; padding: 0.6rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); }
        .card-action-btn:hover { background: var(--input-bg); color: var(--primary-btn-bg); }
        
        /* SCANNER MODAL */
        .scanner-content { width: 90%; max-width: 400px; background: var(--card-bg); border-radius: 1.5rem; padding: 0; overflow: hidden; }
        #reader { width: 100%; border-radius: 0 0 1.5rem 1.5rem; overflow: hidden; }
        .radar-circle { position: absolute; right: -20px; bottom: -50px; width: 200px; height: 200px; border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; animation: pulse-ring 3s infinite; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0; } 50% { opacity: 0.3; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body data-theme="system">
    
    <header class="dashboard-header">
        <div class="logo"><h2 class="logoname">Devices</h2></div>
        <div class="header-right">
            <div class="profile-image-container header-profile-img-container">
                <img id="profile-img-header" src="images/user.png" class="profile-image">
            </div>
        </div>
    </header>

    <br><br><br><br>
    
    <main class="dashboard-container">
        
        <div class="scan-widget">
            <div class="radar-circle"></div>
            <div class="scan-content">
                <h2>Add New Device</h2>
                <p>Pair a new monitor or smartwatch</p>
                <button class="scan-btn" onclick="window.openScanner()">
                    <i class="ri-qr-scan-2-line"></i> Start Scan
                </button>
            </div>
            <div style="font-size: 5rem; opacity: 0.2; transform: rotate(-15deg);">
                <i class="ri-wireless-charging-line"></i>
            </div>
        </div>

        <div class="section-title">Connected Devices</div>
        <div class="device-grid" id="connected-device-list">
            </div>
    </main>

    <nav class="nav">
        <ul class="nav__list">
            <i class="ri-home-smile-2-line nav__link" onclick="location.href='dashboard.html'"></i>
            <i class="ri-file-list-3-line nav__link" onclick="location.href='readings.html'"></i>
            <button class="nav__expand"><i class="ri-add-line nav__expand-icon" style="color: white;"></i></button>
            <i class="ri-device-fill nav__link active-link" onclick="location.href='devices.html'" style="color: var(--primary-btn-bg);"></i>
            <i class="ri-settings-3-line nav__link" onclick="location.href='settings.html'"></i>
        </ul>
    </nav>

    <div id="scannerModal" class="modal">
        <div class="modal-content scanner-content">
            <div class="modal-header" style="padding: 1.5rem; border-bottom: 1px solid var(--border-color);">
                <h3>Scan Watch QR</h3>
                <span class="close-modal" onclick="window.closeScanner()" style="cursor: pointer; font-size: 1.5rem;">&times;</span>
            </div>
            <div class="modal-body" style="padding: 0; text-align: center;">
                <div id="reader-status" style="padding: 20px;">Initializing Camera...</div>
                <div id="reader"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="log/firebaseconfig.js"></script>
    <script src="theme.js"></script>

<script>
    // GLOBAL VARS attached to WINDOW
    window.html5QrCode = null;
    window.currentUser = null;
    window.isScanning = false;

    // 1. AUTH & LOAD
    auth.onAuthStateChanged((user) => {
        if (user) {
            window.currentUser = user;
            loadDevices();
            if(user.photoURL) document.getElementById('profile-img-header').src = user.photoURL;
        } else {
            // window.location.href = 'login.html'; // Uncomment to force login
        }
    });

    // 2. OPEN SCANNER
    window.openScanner = function() {
        if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            return alert("⚠️ HTTPS required for Camera.");
        }

        document.getElementById('scannerModal').classList.add('active');
        
        setTimeout(() => {
            if (!window.html5QrCode) window.html5QrCode = new Html5Qrcode("reader");
            
            window.html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: 250 },
                onScanSuccess,
                (err) => {} // Ignore frame errors
            ).then(() => {
                document.getElementById('reader-status').style.display = 'none';
                window.isScanning = true;
            }).catch(err => {
                document.getElementById('reader-status').textContent = "Camera Error: " + err;
            });
        }, 300);
    }

    // 3. CLOSE SCANNER
    window.closeScanner = function() {
        document.getElementById('scannerModal').classList.remove('active');
        if (window.html5QrCode && window.isScanning) {
            window.html5QrCode.stop().then(() => {
                window.isScanning = false;
                window.html5QrCode.clear();
            });
        }
    }

    // 4. SCAN SUCCESS -> PAIRING
    function onScanSuccess(decodedText) {
        if (decodedText.includes("SUGARTRACK_WATCH")) {
            // BEEP
            new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{});
            
            // Stop Scanner
            window.closeScanner();

            // Handle Sync
            handleSync(decodedText);
        }
    }

    // 5. THE HANDSHAKE (SYNC)
    async function handleSync(qrData) {
        // Format: SUGARTRACK_WATCH_ID_XXXXX
        const parts = qrData.split('_ID_');
        const watchId = parts[1];
        
        if (!watchId || !window.currentUser) return alert("Error: Invalid ID or not logged in.");

        const loadingMsg = document.createElement('div');
        loadingMsg.innerHTML = `<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);color:white;display:flex;justify-content:center;align-items:center;z-index:9999;flex-direction:column;"><i class="ri-loader-4-line ri-spin" style="font-size:3rem;"></i><br>Syncing with Watch...</div>`;
        document.body.appendChild(loadingMsg);

        try {
            // A. Save to User Profile
            await db.collection('users').doc(window.currentUser.uid).collection('devices').add({
                name: `SugarWatch ${watchId.substring(0,4)}`,
                watchId: watchId,
                pairedAt: new Date()
            });

            // B. SEND SIGNAL TO WATCH (This allows the watch to "Enter OS")
            await db.collection('pending_setups').doc(watchId).set({
                userId: window.currentUser.uid,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            setTimeout(() => {
                loadingMsg.remove();
                alert("✅ Sync Complete!");
                loadDevices();
            }, 1500);

        } catch (e) {
            loadingMsg.remove();
            alert("Sync Failed: " + e.message);
        }
    }

    function loadDevices() {
        const list = document.getElementById('connected-device-list');
        db.collection('users').doc(window.currentUser.uid).collection('devices').onSnapshot(snap => {
            list.innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `
                <div class="device-card">
                    <div class="status-dot active"></div>
                    <div class="device-icon-wrapper"><i class="ri-watch-fill"></i></div>
                    <span class="device-name">${d.name}</span>
                    <span class="device-status">Active • Connected</span>
                    <button class="card-action-btn active-btn" onclick="removeDevice('${doc.id}')">Disconnect</button>
                </div>`;
            });
        });
    }

    window.removeDevice = (id) => {
        if(confirm("Disconnect?")) db.collection('users').doc(window.currentUser.uid).collection('devices').doc(id).delete();
    }
</script>
</body>
</html>
