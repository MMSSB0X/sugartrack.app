    <style>
        .update-section {
            text-align: center;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 1rem;
            margin-bottom: 2rem;
        }

        .update-icon {
            font-size: 4rem;
            color: var(--in-range-color);
            margin-bottom: 1rem;
        }

        .update-icon i {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .update-status {
            margin: 1.5rem 0;
            padding: 1rem;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 0.5rem;
        }

        .version-info {
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .current-version {
            font-weight: 600;
            color: var(--in-range-color);
        }

        .update-button {
            width: 100%;
            max-width: 300px;
        }

        .update-loading {
            margin: 2rem 0;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--in-range-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .update-result {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 0.75rem;
            text-align: center;
        }

        .update-available {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #16a34a;
        }

        .update-current {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--in-range-color);
        }

        .update-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--out-of-range-color);
        }

        .update-result i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .update-result h4 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .update-features {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
        }

        .update-features h4 {
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .features-list {
            list-style: none;
            padding: 0;
        }

        .features-list li {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .features-list li:last-child {
            border-bottom: none;
        }

        .features-list i {
            color: var(--in-range-color);
            width: 20px;
        }
    </style>
</body>
